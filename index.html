<script>
// Zawartość wizualizacji jest zaszyfrowana (AES-256-GCM, klucz z hasła przez PBKDF2-SHA256).
// Bez hasła w tym pliku nie ma czytelnych danych domu ani kodu.
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const KEY_STORE = 'dom3d-key';

  async function keyFromPassword(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const loadClassic = src => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s);
  });
  const blobUrl = (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));

  async function start(files) {
    const style = document.createElement('style'); style.textContent = files.style; document.head.appendChild(style);
    document.body.removeAttribute('style');
    document.getElementById('lock').remove();
    document.body.insertAdjacentHTML('afterbegin', files.body);
    await loadClassic(blobUrl(files['house_plan.js']));
    await loadClassic(blobUrl(files['config.js']));
    const mods = { furniture: blobUrl(files['furniture.js']), textures: blobUrl(files['textures.js']), surfaces: blobUrl(files['surfaces.js']) };
    const app = files['app.js'].replace(/from '\.\/(furniture|textures|surfaces)\.js[^']*'/g, (_, n) => `from '${mods[n]}'`);
    const s = document.createElement('script'); s.type = 'module'; s.src = blobUrl(app); document.body.appendChild(s);
  }

  async function tryStored() {
    try {
      const raw = localStorage.getItem(KEY_STORE);
      if (!raw) return false;
      const key = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, true, ['decrypt']);
      await start(await decrypt(key));
      return true;
    } catch { try { localStorage.removeItem(KEY_STORE); } catch {} return false; }
  }

  const form = document.getElementById('lockForm'), err = document.getElementById('err'), go = document.getElementById('go');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Sprawdzam…';
    try {
      const key = await keyFromPassword(document.getElementById('pw').value);
      const files = await decrypt(key);
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEY_STORE, toB64(await crypto.subtle.exportKey('raw', key))); } catch {}
      }
      await start(files);
    } catch {
      err.textContent = 'Nieprawidłowe hasło.';
      go.disabled = false; go.textContent = 'Otwórz';
    }
  });
  tryStored();
})();
</script>
